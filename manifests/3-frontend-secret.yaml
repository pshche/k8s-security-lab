# ============================================================
# ИСПРАВЛЕНИЕ: hardcoded пароль в переменной окружения Deployment
# ============================================================
# Проблема: в Deployment frontend переменная DB_PASSWORD имела значение "hardcoded-password-123"
# (видно в манифесте, можно прочитать через kubectl describe).
# Решение: выносим секрет в отдельный объект Secret.

apiVersion: v1
kind: Secret
metadata:
  name: frontend-db-secret
  namespace: frontend
type: Opaque
data:
  # Значение hardcoded-password-123 в base64
  DB_PASSWORD: aGFyZGNvZGVkLXBhc3N3b3JkLTEyMw==