# ============================================================
# ИСПРАВЛЕНИЕ: использование default ServiceAccount (небезопасно)
# ============================================================
# Проблема: под frontend использует default ServiceAccount,
# который может иметь избыточные права (особенно если привязан к ClusterRole с wildcard).
# Решение: создаём отдельный ServiceAccount с минимальными правами.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: frontend
---
# Создаём Role только с необходимыми правами (принцип минимальных привилегий)
# Разрешаем только get и list для pods и services в рамках неймспейса frontend.
# Никаких wildcard (*) ни в ресурсах, ни в глаголах!
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: frontend
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
# Привязываем Role к новому ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-rolebinding
  namespace: frontend
subjects:
- kind: ServiceAccount
  name: frontend-sa
  namespace: frontend
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io