# ============================================================
# ИСПРАВЛЕНИЕ: секрет хранится в ConfigMap в открытом виде
# ============================================================
# Проблема: в ConfigMap db-config (в неймспейсе backend) хранился пароль POSTGRES_PASSWORD в plain text.
# Решение: создаём Secret типа Opaque (данные хранятся в base64, но это не шифрование,
# а лишь кодирование; для реальной безопасности нужно использовать шифрование etcd или внешний Secret Manager).

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: backend
type: Opaque
data:
  # ВАЖНО: пароль должен совпадать с тем, что был в ConfigMap.
  # В production используйте внешние инструменты (Vault, External Secrets Operator).
  # Пример: пароль "securepassword" в base64.
  password: c2VjdXJlcGFzc3dvcmQ=